# coturn config, deployed on the SAME host as comm-web/comm-worker — a deliberate
# deviation from docs/11-deployment-architecture.md's original "separate VM"
# preference, made at this deployment's actual scale (see that doc's coturn section
# and docs/14-risk-register.md's note on revisiting a dedicated box if call volume
# ever justifies it). Installed via `apt install coturn`; this file is copied to
# /etc/turnserver.conf on the server — kept here per docs/11's own stated intent
# that coturn's config lives in version control (it has no data of its own to back
# up, just this).
#
# `static-auth-secret` below is a PLACEHOLDER — the real value lives only in
# /etc/turnserver.conf on the server and in apps/web/.env's TURN_SHARED_SECRET
# (must be byte-for-byte identical in both places), never committed here.

listening-port=3478
# This droplet's public IP is directly on eth0 (no NAT) — set explicitly rather than
# relying on coturn's own interface auto-detection, which could otherwise pick the
# cloud provider's private-networking interface instead and hand out relay
# candidates nobody outside the datacenter can reach.
listening-ip=134.209.180.65
relay-ip=134.209.180.65
external-ip=134.209.180.65
# 200 ports — plenty for this deployment's realistic concurrent-call count, kept
# narrow specifically to keep the open-port surface small (docs/11's own reasoning
# for preferring a separate VM in the first place was this port range's size; a
# tighter range is the mitigation chosen instead of a second host).
min-port=49152
max-port=49352
fingerprint
# TURN REST API (time-limited HMAC) credentials — see apps/web/app/api/calls/
# turn-credentials/route.ts and docs/08-threat-model.md#call-security. Never a
# static per-client secret.
use-auth-secret
static-auth-secret=REPLACE_WITH_REAL_SECRET_MATCHING_TURN_SHARED_SECRET
realm=apk4game.com
no-cli
# No TLS/DTLS listener this pass — would need its own cert-reuse story (Caddy's
# Let's Encrypt cert isn't in a format turnserver reads directly) for comparatively
# little benefit at this app's scale: WebRTC media itself is already SRTP-encrypted
# end-to-end regardless of whether the TURN control channel is TLS-wrapped. A
# disclosed simplification, not an oversight — revisit if that changes.
no-tls
no-dtls
no-multicast-peers
# SSRF hardening: a TURN relay is a "make outbound connections on my behalf"
# primitive — refuse to ever relay INTO private/reserved address space (loopback,
# RFC1918, link-local, etc.), which no legitimate call peer (always a real client
# on a public IP) has any reason to be in anyway.
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.0.2.0-192.0.2.255
denied-peer-ip=192.88.99.0-192.88.99.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=198.51.100.0-198.51.100.255
denied-peer-ip=203.0.113.0-203.0.113.255
denied-peer-ip=240.0.0.0-255.255.255.255
