name: comm_mobile
description: "Comm — native Flutter client for the existing Comm backend (apps/web, apps/worker). See apps/mobile/README.md for architecture and how this maps to the TypeScript client it replaces."
publish_to: 'none'
version: 1.0.0+5

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # --- State management / navigation -----------------------------------------
  flutter_riverpod: ^2.6.1
  go_router: ^15.1.2

  # --- Networking (mirrors apps/web/lib/api-client.ts + realtime-client.ts) --
  dio: ^5.7.0
  # The backend is a cookie-session API (HttpOnly access/refresh cookies + a
  # double-submit CSRF cookie — apps/web/server/common/cookies.ts), not bearer-token
  # auth, since it was built for a browser client first. cookie_jar persists cookies
  # to disk across app restarts (the mobile equivalent of the browser's own jar);
  # dio_cookie_manager wires it into every request automatically.
  cookie_jar: ^4.0.8
  dio_cookie_manager: ^3.1.1
  web_socket_channel: ^3.0.1

  # --- Crypto (mirrors packages/crypto — see lib/crypto/README.md) -----------
  # Pure-Dart X25519/Ed25519/ChaCha20-Poly1305/HKDF/HMAC/Argon2id — no native
  # bridging needed for correctness; cryptography_flutter below is an optional
  # drop-in performance backend for AES/ChaCha on top of the same API.
  cryptography: ^2.7.0
  cryptography_flutter: ^2.3.4

  # --- Local storage (mirrors apps/web/lib/crypto/db.ts + message-cache.ts) --
  # flutter_secure_storage: every blob this app stores locally (identity bundle,
  # KEK salt, biometric wrap, cached decrypted messages) — the direct analog of
  # db.ts's IndexedDB "wrapped-blobs" store, backed by Keychain/Keystore. A
  # structured on-device database (drift/sqlite3_flutter_libs — the original
  # scaffold's plan) was never actually wired to anything: message_cache.dart ended
  # up small enough to live directly on flutter_secure_storage like everything
  # else, so drift/sqlite3_flutter_libs were dropped — sqlite3_flutter_libs alone
  # was shipping a full native SQLite binary per ABI (~4.5MB combined) for a
  # dependency nothing imported.
  path_provider: ^2.1.5
  flutter_secure_storage: ^9.2.4

  # --- Calling (mirrors components/call/call-provider.tsx's signaling) -------
  flutter_webrtc: ^0.14.1

  # --- Biometric unlock (mirrors lib/crypto/biometric-unlock.ts) -------------
  local_auth: ^2.3.0

  # --- Local (foreground/backgrounded, not killed-app) notifications ---------
  # A real push path (delivery while the app is fully killed) needs FCM/APNs —
  # a separate, larger addition needing Firebase/Apple credentials this app
  # doesn't have yet (see README's "Not built yet"). This covers what's real right
  # now: a system notification the instant a `new` WS event arrives for a
  # conversation that isn't the one currently open, so the user isn't only finding
  # out about a message by reopening the app.
  flutter_local_notifications: ^18.0.1
  # A plain notification (flutter_local_notifications above) can't ring continuously
  # while the app is fully closed and the screen is already on/unlocked — Android's
  # notification API only ever plays a sound once per post. Genuine phone-call-style
  # ringing needs the app registered as a system-level calling app (Telecom
  # ConnectionService on Android, CallKit on iOS) — this plugin wraps both rather
  # than hand-rolling the ConnectionService/PhoneAccount plumbing directly (a
  # notoriously fragile, poorly-documented native API). Used only for the incoming-
  # call UI/ringing itself; the message notification path is untouched.
  flutter_callkit_incoming: ^2.5.4

  # --- Misc -------------------------------------------------------------------
  # Models (api/dtos.dart) are hand-written, not codegen'd (see that file's own
  # docstring) — freezed_annotation/json_annotation/intl were scaffold defaults
  # that never ended up used by any file and are dropped here accordingly.
  permission_handler: ^11.3.1
  uuid: ^4.5.1
  # File/photo picking for the media-attachment pipeline (mirrors the web client's
  # <input type="file">) — image_picker for the camera-roll/photo shortcut,
  # file_picker for arbitrary documents.
  image_picker: ^1.1.2
  file_picker: ^8.1.6
  # Voice notes — recorded raw and sent inline through the same E2E envelope
  # text already uses (contentTypeHint: 'voice'), no object storage, mirroring
  # apps/web/components/chat/message-thread.tsx's own MediaRecorder-based path
  # exactly (see thread_screen.dart's docstring on the format/compat choice).
  # RECORD_AUDIO (Android)/NSMicrophoneUsageDescription (iOS) already exist —
  # voice calling (call_controller.dart) needed them first.
  record: ^6.2.1
  audioplayers: ^6.7.1
  firebase_core: ^4.13.0
  firebase_messaging: ^16.5.0

  # --- In-app update prompt (features/update/) --------------------------------
  # This app is sideloaded (not distributed through Play Store — docs/13-roadmap.md),
  # so there is no store-managed auto-update at all; these two are what make a
  # manual, opt-in "Update available" flow possible. package_info_plus reads this
  # install's own version/build number to compare against the server's advertised
  # latest (GET /app-version.json); android_intent_plus fires the native package
  # installer once a new APK has been downloaded (a FileProvider-backed content://
  # URI — see AndroidManifest.xml's own comment — not a whole extra plugin, since
  # nothing here needs anything beyond "build one Intent and launch it").
  package_info_plus: ^8.1.0
  android_intent_plus: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # build_runner/freezed/json_serializable/drift_dev dropped — nothing in this app
  # is codegen'd (see the `dependencies` block above), so there was never a build
  # step that used them.
  # Dev-only generator, not shipped in the app — see assets/icon/ + the
  # flutter_launcher_icons: block below for what it generates from.
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
    - assets/sounds/

# Generates every platform's real launcher icon (Android mipmap-*/adaptive-icon,
# iOS AppIcon.appiconset) from Comm's actual brand mark — the same
# apps/web/public/icon-*.png assets the web app/PWA already use, not a new design.
# Run `dart run flutter_launcher_icons` after changing anything below.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/icon-512.png
  adaptive_icon_background: "#4F46E5"
  adaptive_icon_foreground: assets/icon/foreground.png
  remove_alpha_ios: true
